kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev-cluster
nodes:
  # Control plane configuration
  - role: control-plane
    image: kindest/node:v1.34.11
    extraPortMappings:
      - containerPort: 80 # Traffic on your host machine's port 8080 will route to container port 30080 (commonly used for NodePort services).
        hostPort: 80
        protocol: TCP
      - containerPort: 443 # Traffic on your host machine's port 443 will route to container port 443
        hostPort: 443
        protocol: TCP

  # Worker nodes configuration
  - role: worker
    image: kindest/node:v1.34.11
  - role: worker
    image: kindest/node:v1.34.11
  - role: worker
    image: kindest/node:v1.34.11
