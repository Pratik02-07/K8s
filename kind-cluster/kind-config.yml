kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev-cluster
# Cotrol plane configuration
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP

  # Worker nodes configuration
  - role: worker # 1
    image: kindest/node:v1.34.11

  - role: worker # 2
    image: kindest/node:v1.34.11

  - role: worker # 3
    image: kindest/node:v1.34.11
