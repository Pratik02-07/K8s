<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<defs>
  <style>
    .title{font:700 34px Arial;fill:#fff}.h{font:700 25px Arial;fill:#10233f}
    .sub{font:16px Arial;fill:#334155}.boxh{font:700 22px Arial;fill:#10233f}
    .txt{font:17px Arial;fill:#243247}.small{font:15px Arial;fill:#475569}
    .pod{fill:#fff;stroke:#64748b;stroke-width:2}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arr)}
  </style>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
</defs>
<rect width="1500" height="760" fill="#f8fafc"/>
<rect x="25" y="20" width="1450" height="72" rx="16" fill="#123e78"/>
<text x="750" y="66" text-anchor="middle" class="title">Kubernetes Workloads: ReplicaSet vs Deployment vs StatefulSet</text>

<!-- ReplicaSet -->
<rect x="35" y="125" width="450" height="565" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
<text x="260" y="170" text-anchor="middle" class="h">ReplicaSet</text>
<text x="260" y="202" text-anchor="middle" class="sub">Maintains the desired number of matching Pods</text>
<rect x="145" y="245" width="230" height="68" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="260" y="286" text-anchor="middle" class="boxh">ReplicaSet</text>
<path class="arrow" d="M260 313 V365 M260 365 H110 V410 M260 365 V410 M260 365 H410 V410"/>
<g>
 <rect class="pod" x="55" y="410" width="110" height="92" rx="12"/><rect class="pod" x="205" y="410" width="110" height="92" rx="12"/><rect class="pod" x="355" y="410" width="110" height="92" rx="12"/>
 <text x="110" y="450" text-anchor="middle" class="boxh">Pod</text><text x="260" y="450" text-anchor="middle" class="boxh">Pod</text><text x="410" y="450" text-anchor="middle" class="boxh">Pod</text>
 <text x="110" y="478" text-anchor="middle" class="small">replica</text><text x="260" y="478" text-anchor="middle" class="small">replica</text><text x="410" y="478" text-anchor="middle" class="small">replica</text>
</g>
<text x="65" y="555" class="txt">• Reconciles actual vs desired count</text>
<text x="65" y="590" class="txt">• Recreates missing Pods</text>
<text x="65" y="625" class="txt">• Usually managed by a Deployment</text>

<!-- Deployment -->
<rect x="525" y="125" width="450" height="565" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
<text x="750" y="170" text-anchor="middle" class="h">Deployment</text>
<text x="750" y="202" text-anchor="middle" class="sub">Manages ReplicaSets and application releases</text>
<rect x="640" y="235" width="220" height="62" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
<text x="750" y="274" text-anchor="middle" class="boxh">Deployment</text>
<path class="arrow" d="M750 297 V335"/>
<rect x="640" y="335" width="220" height="58" rx="12" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
<text x="750" y="372" text-anchor="middle" class="boxh">ReplicaSet</text>
<path class="arrow" d="M750 393 V430 M750 430 H600 V465 M750 430 V465 M750 430 H900 V465"/>
<g>
 <rect class="pod" x="550" y="465" width="100" height="82" rx="12"/><rect class="pod" x="700" y="465" width="100" height="82" rx="12"/><rect class="pod" x="850" y="465" width="100" height="82" rx="12"/>
 <text x="600" y="515" text-anchor="middle" class="boxh">Pod</text><text x="750" y="515" text-anchor="middle" class="boxh">Pod</text><text x="900" y="515" text-anchor="middle" class="boxh">Pod</text>
</g>
<text x="555" y="590" class="txt">• Scaling and self-healing via ReplicaSet</text>
<text x="555" y="625" class="txt">• Rolling updates and rollbacks</text>
<text x="555" y="660" class="txt">• Common choice for stateless apps</text>

<!-- StatefulSet -->
<rect x="1015" y="125" width="450" height="565" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
<text x="1240" y="170" text-anchor="middle" class="h">StatefulSet</text>
<text x="1240" y="202" text-anchor="middle" class="sub">Stable Pod identity and per-replica storage</text>
<rect x="1125" y="245" width="230" height="68" rx="12" fill="#ffedd5" stroke="#f59e0b" stroke-width="2"/>
<text x="1240" y="286" text-anchor="middle" class="boxh">StatefulSet</text>
<path class="arrow" d="M1240 313 V365 M1240 365 H1090 V410 M1240 365 V410 M1240 365 H1390 V410"/>
<g>
 <rect class="pod" x="1035" y="410" width="110" height="82" rx="12"/><rect class="pod" x="1185" y="410" width="110" height="82" rx="12"/><rect class="pod" x="1335" y="410" width="110" height="82" rx="12"/>
 <text x="1090" y="445" text-anchor="middle" class="boxh">app-0</text><text x="1240" y="445" text-anchor="middle" class="boxh">app-1</text><text x="1390" y="445" text-anchor="middle" class="boxh">app-2</text>
 <text x="1090" y="473" text-anchor="middle" class="small">PVC-0</text><text x="1240" y="473" text-anchor="middle" class="small">PVC-1</text><text x="1390" y="473" text-anchor="middle" class="small">PVC-2</text>
</g>
<text x="1045" y="555" class="txt">• Predictable ordinal Pod names</text>
<text x="1045" y="590" class="txt">• Stable network identity via headless Service</text>
<text x="1045" y="625" class="txt">• Ordered operations and persistent claims</text>
<text x="1045" y="660" class="small">Example: databases and clustered stateful apps</text>
</svg>